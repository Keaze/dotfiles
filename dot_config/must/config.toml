# must configuration file

# root directory for library scanning (default: ~/Music)
music_dir = '/home/daniel/Music'
# root directories for library scanning
# format: comma-separated quoted paths inside brackets, e.g. ["~/Music", "/mnt/music"]
# overrides music_dir if set (default: ["~/Music"])
music_dirs = ['/home/daniel/Music']
# path format when saving playlists: relative or absolute (default: relative)
playlist_path_mode = 'relative'
# repeat mode: off, all, one (default: off)
repeat_mode = 'off'
# shuffle playback order (default: false)
shuffle = false
# album sort order in library browser
# alpha: alphabetical (default)
# year_desc: by year, newest first
# year_asc: by year, oldest first
album_sort = 'alpha'
# enable mouse interaction in the library browser (default: false)
mouse_enabled = false
# focus a library browser column when the pointer moves over it (default: false)
mouse_focus_on_hover = false
# replaygain volume normalization
# off, track, album (default: off)
replaygain_mode = 'off'
# restore last session's playlist and position on startup (default: true)
restore_on_start = true
# auto-play a random album when launched with no paths (default: false)
autoplay = false
# display album art for each song
# uses the best supported image protocol with auto fallback
# kitty > iterm2 > sixel > unicode (default: true)
show_album_art = false
# save album art to file, useful for desktop/statusbar widgets (default: false)
copy_album_art = false
# file path for album art copy, needed if copy_album_art is true (default: /tmp/cover.jpg)
album_art_path = '/tmp/cover.jpg'
# custom colors.toml file path, takes priority over theme setting
# fallback order: colors_file > theme > omarchy current theme > Catppuccin Mocha (default: '')
colors_file = '/home/daniel/.config/must/latte.toml'
# built-in theme name
# catppuccin-mocha, gruvbox-dark, dark-red, osaka-jade, synth, basic (default: '')
theme = ''
# use terminal's default background color (default: false)
transparent_background = false
# disable all theming, use terminal's default colors (default: false)
disable_theme = false
# Discogs personal access token
# enables artist images + higher API rate limits
# get one at: https://www.discogs.com/settings/developers
# alternative: set discogs_key + discogs_secret, or env vars DISCOGS_TOKEN / DISCOGS_KEY + DISCOGS_SECRET (default: '')
discogs_token = ''
# Discogs consumer key (developer app auth)
# alternative to discogs_token, requires both key and secret (default: '')
discogs_key = ''
# Discogs consumer secret (developer app auth)
# alternative to discogs_token, requires both key and secret (default: '')
discogs_secret = ''
# TheAudioDB API key for artist info and album art fallback
# free key '123' is used by default
# get a custom key at: https://www.theaudiodb.com/apikey (default: '123')
theaudiodb_api_key = '123'
# directories containing temp/download albums (each subfolder = one album)
# format: comma-separated quoted paths inside brackets, e.g. ["~/Downloads", "/tmp/music"]
# press T in the TUI to browse (default: [])
temp_dirs = []
# show desktop notifications on song changes (default: false)
notifications_enabled = false
# include album art thumbnail in notifications (default: true)
notifications_show_art = true
# UI layout mode
# large: full layout with all elements (default)
# medium: no bottom view (no playlist/lyrics/visualizer)
# compact: no album art, no bottom view, mini footer
# narrow: album art top-left, now playing below, mini footer (default: large)
layout = 'large'
# force a specific image protocol instead of auto-detecting
# options: kitty, sixel, halfblocks, iterm2, or empty for auto-detect (default: '')
force_protocol = ''
# show header bar with title (default: true)
show_header = true
# show footer bar with keybindings (default: true)
show_footer = true
# typewriter reveal for now-playing metadata
# off: instant (default)
# machine: print characters one at a time at a constant rate
# human: bursty human-like typing with pauses
title_animation = 'off'
# which rows the reveal covers
# song: apply effect to just the song title (default)
# all: apply effect to song, artist, and album
title_animation_scope = 'song'

# palette indices for cursor/accent/muted when disable_theme is true
[terminal_palette]
# palette index for cursor color (0-15, default: 2 = green)
cursor = 2
# palette index for accent color (0-15, default: 4 = blue)
accent = 4
# palette index for muted color (0-15, default: 8 = gray)
muted = 8

# Last.fm scrobbling
# run 'must --lastfm-auth' once to obtain a session key
[lastfm]
# enable Last.fm scrobbling (default: false)
enabled = false
# Last.fm API key from https://www.last.fm/api/account/create (default: '')
api_key = ''
# Last.fm shared secret from your API account (default: '')
shared_secret = ''
# obtained via 'must --lastfm-auth' (default: '')
session_key = ''

# ListenBrainz scrobbling
# token found at: https://listenbrainz.org/profile/
[listenbrainz]
# enable ListenBrainz scrobbling (default: false)
enabled = false
# user token from https://listenbrainz.org/profile/ (default: '')
token = ''

# Lidarr music collection manager
# shows artist/album monitoring status, opens Lidarr web UI
# api_key from: Lidarr Settings > General
[lidarr]
# enable Lidarr integration (default: false)
enabled = false
# Lidarr base URL (e.g., http://localhost:8686)
url = ''
# Lidarr API key from Settings > General
api_key = ''

# Subsonic-compatible server client (Navidrome, Jellyfin, etc.)
[subsonic]
# enable Subsonic-compatible server client (default: false)
enabled = false
# Subsonic server base URL (e.g., http://navidrome.local:4533)
url = ''
# Subsonic username
username = ''
# Subsonic password or hex-encoded token
password = ''
# display name for the server (default: Subsonic)
server_name = ''
# 2-char badge shown next to remote tracks (default: S)
server_badge = 'S'

# audio visualizer settings
[visualizer]
# default visualizer mode
# Bars, Braille, ClassicPeak, Wave, Stars, BrailleBars, Rain, Segmented, Binary (default: Bars)
mode = 'Segmented'
# song info overlay in fullscreen visualizer
# fade, on, off (default: fade)
show_info = 'fade'
# seconds to show song info overlay (default: 5)
info_duration = 5
# use real audio capture
# Linux: PipeWire (pw-record) or PulseAudio (parecord)
# Windows: WASAPI loopback
# macOS: not supported (default: true)
real_audio = true

# audio output settings
[audio]
# audio server address for SSH audio forwarding
# used with --audio-forward flag when running over SSH
# example: "tcp:localhost:4713" (default: '')
ssh_audio_server = ''
