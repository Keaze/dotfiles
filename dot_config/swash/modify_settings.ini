#!/bin/sh
# Swash rewrites [state] (last tool, tool sizes) on every use.
# Manage [preferences] here and keep all other sections from the live file.
cat <<'EOF'
[preferences]
window_background_mode=0
window_background_opacity=0.80000000000000004
floating_controls_blur=true
floating_controls_opacity=0.69999999999999996
esc_closes_window=true
close_after_copy=true
close_after_save=true
auto_copy_latest_change=false
remember_tool_sizes=true
allow_highlighter_overlap=true
shortcut_open=<Primary>o
shortcut_save=<Primary>s
shortcut_copy=<Primary>c
shortcut_undo=<Primary>z
shortcut_redo=<Primary><Shift>z
shortcut_zoom_in=<Primary>plus
shortcut_zoom_out=<Primary>minus
shortcut_zoom_fit=<Primary>0
shortcut_rotate=<Control>r
shortcut_flip_horizontal=
shortcut_flip_vertical=
shortcut_preferences=<Primary>comma
shortcut_quit=<Primary>q
shortcut_size_decrease=bracketleft
shortcut_size_increase=bracketright
shortcut_tool_move=1
shortcut_tool_brush=2
shortcut_tool_arrow=3
shortcut_tool_rectangle=4
shortcut_tool_circle=5
shortcut_tool_line=6
shortcut_tool_highlighter=7
shortcut_tool_text=8
shortcut_tool_numbering=9
shortcut_tool_blur=0
shortcut_tool_eraser=e
shortcut_tool_crop=c
shortcut_tool_pan=p
shortcut_tool_ocr=r
angle_snap_modifiers=1
EOF
awk '/^\[/ { keep = ($0 != "[preferences]"); if (keep) print "" } keep'
