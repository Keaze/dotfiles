[".config/tmux/plugins/tpm"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tpm"
refreshPeriod = "1h"


# Pinned to a release tag; bump the tag to upgrade (no refresh: a tag checkout can't be pulled)
[".config/tmux/plugins/catppuccin/tmux"]
type = "git-repo"
url = "https://github.com/catppuccin/tmux.git"
clone.args = ["--branch", "v2.3.1"]

# Own repo, edited in place: cloned only if missing, then managed with git directly
[".config/nvim"]
type = "git-repo"
url = "git@github.com:Keaze/Neovim-Config.git"

# zsh plugins (sourced from ~/.zshrc)
[".local/share/zsh/plugins/zsh-autosuggestions"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-autosuggestions.git"
refreshPeriod = "168h"

[".local/share/zsh/plugins/fast-syntax-highlighting"]
type = "git-repo"
url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git"
refreshPeriod = "168h"

[".local/share/zsh/plugins/fzf-tab"]
type = "git-repo"
url = "https://github.com/Aloxaf/fzf-tab.git"
refreshPeriod = "168h"

# zsh-abbr needs its zsh-job-queue submodule
[".local/share/zsh/plugins/zsh-abbr"]
type = "git-repo"
url = "https://github.com/olets/zsh-abbr.git"
refreshPeriod = "168h"
clone.args = ["--recurse-submodules"]
pull.args = ["--recurse-submodules"]

[".local/share/zsh/plugins/zsh-autopair"]
type = "git-repo"
url = "https://github.com/hlissner/zsh-autopair.git"
refreshPeriod = "168h"

[".local/share/zsh/plugins/zsh-auto-notify"]
type = "git-repo"
url = "https://github.com/MichaelAquilina/zsh-auto-notify.git"
refreshPeriod = "168h"
