# ~/.abcde.conf — quality FLAC ripping

# --- Metadata lookup ---
CDDBMETHOD=musicbrainz

# --- Output ---
OUTPUTTYPE=flac
OUTPUTDIR="$HOME/rips"

# Temp workspace for intermediate WAVs — needs space, keep on fast local disk
WAVOUTPUTDIR="/tmp"

# --- FLAC encoder ---
FLACENCODERSYNTAX=flac
FLAC=$(command -v flac)
FLACOPTS='-s -8 -V'
#   -s  silent
#   -8  maximum compression (lossless: identical audio, smaller file, slower)
#   -V  verify — decode each frame while encoding and compare to the source

# --- Secure ripping ---
CDROMREADERSYNTAX=cdparanoia
CDPARANOIA=cdparanoia
CDPARANOIAOPTS='--never-skip=40'
#   retry a bad sector up to 40 times before giving up

CDROM=/dev/sr0

# --- Filenames / layout ---
PADTRACKS=y
OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM} - ${TRACKFILE}'
VAOUTPUTFORMAT='Various Artists/${ALBUMFILE}/${TRACKNUM} - ${ARTISTFILE} - ${TRACKFILE}'

mungefilename ()
{
  echo "$@" | sed 's:/:-:g' | tr -d ':\000-\037'
}

# --- Behaviour ---
ACTIONS=cddb,read,encode,tag,move,clean
MAXPROCS=4          # parallel encodes; set to roughly your core count
EJECTCD=y
